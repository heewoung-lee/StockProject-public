    <text x="56" y="728" fill="#8FA8B4" font-size="14">과거 기록이며 미래 수익을 뜻하지 않습니다. 실현손익은 StockBot 관리 원장 기준이며, 원장에 배분되지 않은 수수료·세금 등은 포함하지 않았습니다.</text>
