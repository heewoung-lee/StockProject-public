<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">2026년 8월 3일부터 8월 9일까지 StockBot 최근 7일 성적표</title>
  <desc id="desc">StockBot 관리 실현손익 8,745원, 관리 체결 증가분 147건, 기록된 거래일 5일과 날짜별 관리 실현손익</desc>
  <defs>
