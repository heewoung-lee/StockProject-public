<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">StockBot 엔진의 반복 원리</title>
  <desc id="desc">거래량 순위, 대상 선별, 매수, 계속 감시, 조건 이탈 시 매도를 반복하는 다섯 단계 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061019"/>
      <stop offset="1" stop-color="#0B1B25"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102A38"/>
      <stop offset="1" stop-color="#0B1B25"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC7F0"/>
      <stop offset="0.7" stop-color="#5EE37D"/>
      <stop offset="1" stop-color="#2EC7F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#02070B" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2EC7F0"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5EE37D"/>
    </marker>
  </defs>

  <rect width="1440" height="660" rx="32" fill="url(#background)"/>
  <circle cx="122" cy="70" r="150" fill="#2EC7F0" opacity="0.035"/>
  <circle cx="1320" cy="590" r="210" fill="#5EE37D" opacity="0.025"/>

  <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
    <text x="64" y="74" fill="#E7F0F4" font-size="32" font-weight="700">엔진은 이 다섯 동작을 반복합니다</text>
    <text x="64" y="110" fill="#8FA8B4" font-size="18">예측을 뽐내는 대신, 정해진 순서를 지치지 않고 계속 실행합니다.</text>

    <g stroke="#2EC7F0" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.8">
      <path d="M 304 304 H 332"/>
      <path d="M 580 304 H 608"/>
      <path d="M 856 304 H 884"/>
      <path d="M 1132 304 H 1160"/>
    </g>

    <!-- 01 Volume ranking -->
    <g transform="translate(56 154)" filter="url(#shadow)">
      <rect width="248" height="300" rx="24" fill="url(#card)" stroke="#1D5263"/>
      <text x="24" y="42" fill="#2EC7F0" font-size="15" font-weight="700" letter-spacing="2">01</text>
      <g transform="translate(24 66)">
        <rect x="0" y="0" width="128" height="14" rx="7" fill="#2EC7F0"/>
        <rect x="0" y="28" width="104" height="14" rx="7" fill="#2EC7F0" opacity="0.8"/>
        <rect x="0" y="56" width="80" height="14" rx="7" fill="#5EE37D" opacity="0.85"/>
        <rect x="0" y="84" width="54" height="14" rx="7" fill="#5EE37D" opacity="0.65"/>
        <circle cx="158" cy="7" r="7" fill="#2EC7F0"/>
        <circle cx="158" cy="35" r="7" fill="#2EC7F0" opacity="0.8"/>
        <circle cx="158" cy="63" r="7" fill="#5EE37D" opacity="0.85"/>
        <circle cx="158" cy="91" r="7" fill="#5EE37D" opacity="0.65"/>
      </g>
      <text x="24" y="205" fill="#E7F0F4" font-size="24" font-weight="700">거래량 순위</text>
      <text x="24" y="240" fill="#8FA8B4" font-size="16">실시간 거래량이</text>
      <text x="24" y="264" fill="#8FA8B4" font-size="16">많은 순서로 정렬</text>
    </g>

    <!-- 02 Filtering -->
    <g transform="translate(332 154)" filter="url(#shadow)">
      <rect width="248" height="300" rx="24" fill="url(#card)" stroke="#1D5263"/>
      <text x="24" y="42" fill="#2EC7F0" font-size="15" font-weight="700" letter-spacing="2">02</text>
      <g transform="translate(55 64)" fill="none" stroke-linejoin="round">
        <path d="M 0 0 H 138 L 86 58 V 108 L 52 126 V 58 Z" stroke="#2EC7F0" stroke-width="8"/>
        <path d="M 52 58 H 86" stroke="#5EE37D" stroke-width="8"/>
      </g>
      <text x="24" y="205" fill="#E7F0F4" font-size="24" font-weight="700">대상 선별</text>
      <text x="24" y="240" fill="#8FA8B4" font-size="16">우리의 거래 조건에</text>
      <text x="24" y="264" fill="#8FA8B4" font-size="16">맞는 종목만 남김</text>
    </g>

    <!-- 03 Buy -->
    <g transform="translate(608 154)" filter="url(#shadow)">
      <rect width="248" height="300" rx="24" fill="url(#card)" stroke="#1D5263"/>
      <text x="24" y="42" fill="#2EC7F0" font-size="15" font-weight="700" letter-spacing="2">03</text>
      <g transform="translate(67 65)">
        <circle cx="57" cy="57" r="55" fill="#5EE37D" opacity="0.12" stroke="#5EE37D" stroke-width="4"/>
        <path d="M 57 28 V 86 M 28 57 H 86" stroke="#5EE37D" stroke-width="10" stroke-linecap="round"/>
      </g>
      <text x="24" y="205" fill="#E7F0F4" font-size="24" font-weight="700">매수</text>
      <text x="24" y="240" fill="#8FA8B4" font-size="16">조건을 통과한</text>
      <text x="24" y="264" fill="#8FA8B4" font-size="16">종목을 매수</text>
    </g>

    <!-- 04 Monitor -->
    <g transform="translate(884 154)" filter="url(#shadow)">
      <rect width="248" height="300" rx="24" fill="url(#card)" stroke="#1D5263"/>
      <text x="24" y="42" fill="#2EC7F0" font-size="15" font-weight="700" letter-spacing="2">04</text>
      <g transform="translate(49 78)" fill="none">
        <path d="M 0 44 C 34 -4 116 -4 150 44 C 116 92 34 92 0 44 Z" stroke="#2EC7F0" stroke-width="7"/>
        <circle cx="75" cy="44" r="22" stroke="#5EE37D" stroke-width="7"/>
        <circle cx="75" cy="44" r="7" fill="#5EE37D"/>
      </g>
      <text x="24" y="205" fill="#E7F0F4" font-size="24" font-weight="700">계속 감시</text>
      <text x="24" y="240" fill="#8FA8B4" font-size="16">보유 종목이 조건을</text>
      <text x="24" y="264" fill="#8FA8B4" font-size="16">지키는지 반복 확인</text>
    </g>

    <!-- 05 Sell -->
    <g transform="translate(1160 154)" filter="url(#shadow)">
      <rect width="224" height="300" rx="24" fill="url(#card)" stroke="#1D5263"/>
      <text x="24" y="42" fill="#2EC7F0" font-size="15" font-weight="700" letter-spacing="2">05</text>
      <g transform="translate(49 68)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 55 H 110" stroke="#FF6B5E" stroke-width="10"/>
        <path d="M 78 20 L 114 55 L 78 90" stroke="#FF6B5E" stroke-width="10"/>
        <path d="M 16 16 V 4 H 128 V 106 H 16 V 94" stroke="#8FA8B4" stroke-width="5" opacity="0.65"/>
      </g>
      <text x="24" y="205" fill="#E7F0F4" font-size="24" font-weight="700">매도</text>
      <text x="24" y="240" fill="#8FA8B4" font-size="16">거래 조건을</text>
      <text x="24" y="264" fill="#8FA8B4" font-size="16">벗어나면 매도</text>
    </g>

    <path d="M 1272 478 V 542 Q 1272 582 1232 582 H 200 Q 160 582 160 542 V 484" fill="none" stroke="url(#loop)" stroke-width="5" stroke-linecap="round" marker-end="url(#loop-arrow)"/>
    <rect x="548" y="552" width="344" height="58" rx="29" fill="#061019" stroke="#1D5263"/>
    <circle cx="582" cy="581" r="8" fill="#5EE37D"/>
    <text x="604" y="588" fill="#E7F0F4" font-size="18" font-weight="600">빈 자리를 다시 채우며 반복</text>
  </g>
</svg>
