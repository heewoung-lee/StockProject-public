name: Public source security scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-public-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Block private files, personal paths, and secrets
        run: python3 .github/scripts/validate_public_snapshot.py .
